name: Build Bankai ZEX INJECTOR IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: false
        default: 'Bankai'
      bundle_id:
        description: 'Bundle Identifier'
        required: false
        default: 'com.bankai.injector'
      badge_title:
        description: 'Top Badge Title & Main Header'
        required: false
        default: 'BANKAI EXTERNAL'
      version:
        description: 'App Version'
        required: false
        default: '1.0.0'
      icon_url:
        description: 'Custom App Icon URL (PNG)'
        required: false
        default: ''
      bg_gif_url:
        description: 'Custom Main BG GIF URL'
        required: false
        default: ''
      login_sound_url:
        description: 'Custom Login Sound URL (WAV)'
        required: false
        default: ''
      activate_sound_url:
        description: 'Custom Activate Sound URL (WAV)'
        required: false
        default: ''
      telegram_url:
        description: 'Custom Telegram Channel Link'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Custom Branding & Inputs
        run: |
          python3 - << 'EOF'
          import os, re, glob, urllib.request, plistlib

          app_name = """${{ inputs.app_name }}""".strip() or "Bankai"
          bundle_id = """${{ inputs.bundle_id }}""".strip() or "com.bankai.injector"
          badge_title = """${{ inputs.badge_title }}""".strip() or "BANKAI EXTERNAL"
          version = """${{ inputs.version }}""".strip() or "1.0.0"
          icon_url = """${{ inputs.icon_url }}""".strip()
          bg_gif_url = """${{ inputs.bg_gif_url }}""".strip()
          login_sound_url = """${{ inputs.login_sound_url }}""".strip()
          activate_sound_url = """${{ inputs.activate_sound_url }}""".strip()
          telegram_url = """${{ inputs.telegram_url }}""".strip()

          print(f"=== Applying Custom Branding ===")
          print(f"App Name: {app_name}")
          print(f"Bundle ID: {bundle_id}")
          print(f"Badge & Header Title: {badge_title}")
          print(f"Version: {version}")
          if telegram_url: print(f"Telegram URL: {telegram_url}")

          # 1. Update Info.plist
          if os.path.exists("Info.plist"):
              with open("Info.plist", "rb") as f:
                  plist = plistlib.load(f)
              plist["CFBundleDisplayName"] = app_name
              plist["CFBundleName"] = app_name
              plist["CFBundleIdentifier"] = bundle_id
              plist["CFBundleShortVersionString"] = version
              plist["CFBundleVersion"] = version
              with open("Info.plist", "wb") as f:
                  plistlib.dump(plist, f)
              print("✅ Info.plist updated successfully.")

          # 2. Patch ZEXInjectorVC.m
          if os.path.exists("ZEXInjectorVC.m"):
              with open("ZEXInjectorVC.m", "r", encoding="utf-8") as f:
                  code = f.read()

              # Replace Badge Text
              code = re.sub(r'badgeLbl\.text\s*=\s*@"[^"]*";', f'badgeLbl.text = @"{badge_title}";', code)
              # Replace Header Title
              code = re.sub(r'NSString\s*\*headerTitle\s*=\s*@"[^"]*";', f'NSString *headerTitle = @"{badge_title}";', code)
              # Replace License Placeholder
              code = re.sub(r'initWithString:@"[a-zA-Z0-9_\s]*-XXXX-XXXX-XXXX"', f'initWithString:@"{app_name.upper()}-XXXX-XXXX-XXXX"', code)
              # Replace Telegram URL
              if telegram_url:
                  code = re.sub(r'static NSString \*kBundledTG = @"[^"]*";', f'static NSString *kBundledTG = @"{telegram_url}";', code)
                  code = code.replace("https://t.me/nothing6769", telegram_url)

              with open("ZEXInjectorVC.m", "w", encoding="utf-8") as f:
                  f.write(code)
              print("✅ ZEXInjectorVC.m patched successfully.")

          # 3. Download Remote Assets if URLs provided
          if icon_url and icon_url.startswith("http"):
              print(f"Downloading icon from {icon_url}...")
              urllib.request.urlretrieve(icon_url, "Resources/app_logo.png")

          if bg_gif_url and bg_gif_url.startswith("http"):
              print(f"Downloading background GIF from {bg_gif_url}...")
              urllib.request.urlretrieve(bg_gif_url, "Resources/main bg.gif")

          if login_sound_url and login_sound_url.startswith("http"):
              print(f"Downloading login sound from {login_sound_url}...")
              urllib.request.urlretrieve(login_sound_url, "Resources/Welcome_Baby.wav")

          if activate_sound_url and activate_sound_url.startswith("http"):
              print(f"Downloading activate sound from {activate_sound_url}...")
              urllib.request.urlretrieve(activate_sound_url, "Resources/activate.wav")

          # 4. Synchronize all iOS app icon files
          if os.path.exists("Resources/app_logo.png"):
              import shutil
              icon_files = glob.glob("Resources/AppIcon*.png") + glob.glob("Resources/Icon*.png")
              for icon in icon_files:
                  shutil.copyfile("Resources/app_logo.png", icon)
              print(f"✅ Replaced {len(icon_files)} icon files with custom app_logo.png.")

          print("=== Custom Branding Configuration Complete ===")
          EOF

      - name: Install Build Dependencies
        run: |
          brew install ldid make dpkg

      - name: Setup Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Setup iOS SDKs
        run: |
          export THEOS="$HOME/theos"
          mkdir -p "$THEOS/sdks"
          
          # Download community header-complete SDKs
          echo "Downloading Theos SDKs..."
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o master.tar.gz
          TMP_DIR=$(mktemp -d)
          tar -zxf master.tar.gz -C "$TMP_DIR"
          cp -r "$TMP_DIR"/sdks-master/*.sdk "$THEOS/sdks/" 2>/dev/null || true
          rm -rf master.tar.gz "$TMP_DIR"
          
          # Link Xcode local SDK
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
          if [ -d "$XCODE_SDK" ]; then
            echo "Linking Xcode SDK: $XCODE_SDK"
            ln -sf "$XCODE_SDK" "$THEOS/sdks/$(basename "$XCODE_SDK")"
            ln -sf "$XCODE_SDK" "$THEOS/sdks/iPhoneOS.sdk"
            ln -sf "$XCODE_SDK" "$THEOS/sdks/iPhoneOS17.5.sdk"
          fi
          
          echo "Available SDKs in Theos:"
          ls -la "$THEOS/sdks"

      - name: Compile Project
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$(brew --prefix make)/libexec/gnubin:$PATH"
          
          echo "Current directory: $(pwd)"
          make clean
          make messages=yes FINALPACKAGE=1
          
          echo "=== Build output directories ==="
          find .theos -type d -name "*.app" || true

      - name: Package IPA
        run: |
          APP=$(find .theos -name "ZEXInjector.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            APP=$(find .theos -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP" ]; then
            APP=$(find . -name "ZEXInjector.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP" ]; then
            echo "ERROR: .app bundle not found after compilation!"
            exit 1
          fi
          
          echo "Found compiled app at: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/ZEXInjector.app
          
          # Copy resources if present
          if [ -d "Resources" ]; then
            echo "Copying Resources into app bundle..."
            cp -R Resources/* Payload/ZEXInjector.app/ 2>/dev/null || true
          fi
          
          # Copy Info.plist if present
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/ZEXInjector.app/Info.plist
          fi
          
          # Sign binary with entitlements using ldid
          if [ -f "entitlements.plist" ] && [ -f "Payload/ZEXInjector.app/ZEXInjector" ]; then
            echo "Signing with entitlements.plist via ldid..."
            ldid -Sentitlements.plist Payload/ZEXInjector.app/ZEXInjector || true
          fi
          
          # Zip into IPA
          zip -qry bankai-ZEXInjector.ipa Payload
          echo "=== IPA Created Successfully ==="
          ls -lh bankai-ZEXInjector.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bankai-ZEXInjector-IPA
          path: bankai-ZEXInjector.ipa
          retention-days: 30

      - name: Publish Direct Download Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')"
          NAME="${{ inputs.app_name }}"
          if [ -z "$NAME" ]; then
            NAME="Bankai"
          fi
          echo "Creating public release: $TAG with name $NAME"
          gh release create "$TAG" bankai-ZEXInjector.ipa \
            --title "$NAME iOS IPA ($TAG)" \
            --notes "Direct download IPA build for $NAME (${{ inputs.badge_title || 'BANKAI EXTERNAL' }}). Generated on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            --target ${{ github.ref }} || true
