name: Build Bankai ZEX INJECTOR IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name (leave blank for repository default)'
        required: false
        default: ''
      bundle_id:
        description: 'Bundle Identifier (leave blank for repository default)'
        required: false
        default: ''
      badge_title:
        description: 'Top Badge Title & Main Header (leave blank for repository default)'
        required: false
        default: ''
      version:
        description: 'App Version (leave blank for repository default)'
        required: false
        default: ''
      icon_url:
        description: 'Custom App Icon URL (PNG)'
        required: false
        default: ''
      bg_gif_url:
        description: 'Custom Main BG GIF URL'
        required: false
        default: ''
      login_sound_url:
        description: 'Custom Login Sound URL (WAV)'
        required: false
        default: ''
      activate_sound_url:
        description: 'Custom Activate Sound URL (WAV)'
        required: false
        default: ''
      telegram_url:
        description: 'Custom Telegram Channel Link'
        required: false
        default: ''
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Custom Branding & Inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          APP_NAME="${{ inputs.app_name }}"
          BUNDLE_ID="${{ inputs.bundle_id }}"
          BADGE_TITLE="${{ inputs.badge_title }}"
          APP_VER="${{ inputs.version }}"
          ICON_URL="${{ inputs.icon_url }}"
          BG_GIF_URL="${{ inputs.bg_gif_url }}"
          LOGIN_SOUND_URL="${{ inputs.login_sound_url }}"
          ACTIVATE_SOUND_URL="${{ inputs.activate_sound_url }}"
          TELEGRAM_URL="${{ inputs.telegram_url }}"

          if [ -z "$APP_NAME" ] && [ -z "$BUNDLE_ID" ] && [ -z "$BADGE_TITLE" ] && [ -z "$APP_VER" ] && [ -z "$ICON_URL" ] && [ -z "$BG_GIF_URL" ] && [ -z "$LOGIN_SOUND_URL" ] && [ -z "$ACTIVATE_SOUND_URL" ] && [ -z "$TELEGRAM_URL" ]; then
            echo "No custom overrides provided. Building with 100% default local repository configurations."
            exit 0
          fi

          echo "=== Applying Custom Configurations ==="
          if [ -n "$APP_NAME" ]; then
            echo "Setting App Name to: $APP_NAME"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName '$APP_NAME'" Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string '$APP_NAME'" Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleName '$APP_NAME'" Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string '$APP_NAME'" Info.plist
            sed -i '' "s/BANKAI-XXXX-XXXX-XXXX/${APP_NAME}-XXXX-XXXX-XXXX/g" ZEXInjectorVC.m || true
            sed -i '' "s/ZEX-XXXX-XXXX-XXXX/${APP_NAME}-XXXX-XXXX-XXXX/g" ZEXInjectorVC.m || true
          fi

          if [ -n "$BUNDLE_ID" ]; then
            echo "Setting Bundle ID to: $BUNDLE_ID"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier '$BUNDLE_ID'" Info.plist 2>/dev/null || true
          fi

          if [ -n "$APP_VER" ]; then
            echo "Setting Version to: $APP_VER"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString '$APP_VER'" Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion '$APP_VER'" Info.plist 2>/dev/null || true
          fi

          if [ -n "$BADGE_TITLE" ]; then
            echo "Setting Badge & Header Title to: $BADGE_TITLE"
            sed -i '' "s/badgeLbl.text = @\"[^\"]*\";/badgeLbl.text = @\"$BADGE_TITLE\";/g" ZEXInjectorVC.m || true
            sed -i '' "s/badgeLbl.text=@\"[^\"]*\";/badgeLbl.text=@\"$BADGE_TITLE\";/g" ZEXInjectorVC.m || true
            sed -i '' "s/NSString \*headerTitle = @\"[^\"]*\";/NSString \*headerTitle = @\"$BADGE_TITLE\";/g" ZEXInjectorVC.m || true
            sed -i '' "s/initWithString:@\"BANKAI EXTERNAL\"/initWithString:@\"$BADGE_TITLE\"/g" ZEXInjectorVC.m || true
            sed -i '' "s/initWithString:@\"ZEX EXTERNAL\"/initWithString:@\"$BADGE_TITLE\"/g" ZEXInjectorVC.m || true
          fi

          if [ -n "$TELEGRAM_URL" ]; then
            echo "Setting Telegram URL to: $TELEGRAM_URL"
            sed -i '' "s|https://t.me/[a-zA-Z0-9_]*|$TELEGRAM_URL|g" ZEXInjectorVC.m || true
          fi

          if [ -n "$LOGIN_SOUND_URL" ]; then
            echo "Downloading custom login sound from: $LOGIN_SOUND_URL"
            curl -fsSL "$LOGIN_SOUND_URL" -o Resources/Welcome_Baby.wav || true
          fi

          if [ -n "$ACTIVATE_SOUND_URL" ]; then
            echo "Downloading custom activate sound from: $ACTIVATE_SOUND_URL"
            curl -fsSL "$ACTIVATE_SOUND_URL" -o Resources/activate.wav || true
          fi

          if [ -n "$ICON_URL" ]; then
            echo "Downloading custom app icon from: $ICON_URL"
            curl -fsSL "$ICON_URL" -o Resources/app_logo.png || true
            for f in Resources/AppIcon*.png Resources/Icon*.png; do
              if [ -f "$f" ]; then
                cp Resources/app_logo.png "$f" 2>/dev/null || true
              fi
            done
          fi

          if [ -n "$BG_GIF_URL" ]; then
            echo "Downloading custom background GIF from: $BG_GIF_URL"
            curl -fsSL "$BG_GIF_URL" -o "Resources/main bg.gif" || true
          fi

      - name: Install Build Dependencies
        run: |
          brew install ldid make dpkg

      - name: Setup Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Setup iOS SDKs
        run: |
          export THEOS="$HOME/theos"
          mkdir -p "$THEOS/sdks"
          
          # Download community header-complete SDKs
          echo "Downloading Theos SDKs..."
          curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o master.tar.gz
          TMP_DIR=$(mktemp -d)
          tar -zxf master.tar.gz -C "$TMP_DIR"
          cp -r "$TMP_DIR"/sdks-master/*.sdk "$THEOS/sdks/" 2>/dev/null || true
          rm -rf master.tar.gz "$TMP_DIR"
          
          # Link Xcode local SDK
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
          if [ -d "$XCODE_SDK" ]; then
            echo "Linking Xcode SDK: $XCODE_SDK"
            ln -sf "$XCODE_SDK" "$THEOS/sdks/$(basename "$XCODE_SDK")"
            ln -sf "$XCODE_SDK" "$THEOS/sdks/iPhoneOS.sdk"
            ln -sf "$XCODE_SDK" "$THEOS/sdks/iPhoneOS17.5.sdk"
          fi
          
          echo "Available SDKs in Theos:"
          ls -la "$THEOS/sdks"

      - name: Compile Project
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$(brew --prefix make)/libexec/gnubin:$PATH"
          
          echo "Current directory: $(pwd)"
          make clean
          make messages=yes FINALPACKAGE=1
          
          echo "=== Build output directories ==="
          find .theos -type d -name "*.app" || true

      - name: Package IPA
        run: |
          APP=$(find .theos -name "ZEXInjector.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            APP=$(find .theos -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP" ]; then
            APP=$(find . -name "ZEXInjector.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP" ]; then
            echo "ERROR: .app bundle not found after compilation!"
            exit 1
          fi
          
          echo "Found compiled app at: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/ZEXInjector.app
          
          # Copy resources if present
          if [ -d "Resources" ]; then
            echo "Copying Resources into app bundle..."
            cp -R Resources/* Payload/ZEXInjector.app/ 2>/dev/null || true
          fi
          
          # Copy Info.plist if present
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/ZEXInjector.app/Info.plist
          fi
          
          # Sign binary with entitlements using ldid
          if [ -f "entitlements.plist" ] && [ -f "Payload/ZEXInjector.app/ZEXInjector" ]; then
            echo "Signing with entitlements.plist via ldid..."
            ldid -Sentitlements.plist Payload/ZEXInjector.app/ZEXInjector || true
          fi
          
          # Zip into IPA
          zip -qry bankai-ZEXInjector.ipa Payload
          echo "=== IPA Created Successfully ==="
          ls -lh bankai-ZEXInjector.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bankai-ZEXInjector-IPA
          path: bankai-ZEXInjector.ipa
          retention-days: 30

      - name: Publish Direct Download Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')"
          NAME="${{ inputs.app_name }}"
          if [ -z "$NAME" ]; then
            NAME="Bankai"
          fi
          echo "Creating public release: $TAG with name $NAME"
          gh release create "$TAG" bankai-ZEXInjector.ipa \
            --title "$NAME iOS IPA ($TAG)" \
            --notes "Direct download IPA build for $NAME (${{ inputs.badge_title || 'BANKAI EXTERNAL' }}). Generated on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            --target ${{ github.ref }} || true
